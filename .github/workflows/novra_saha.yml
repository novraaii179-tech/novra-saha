name: Novra Saha Botu (Otonom 81 İl Tarama)

on:
  # 1. Her 15 dakikada bir otonom rotasyonel tarama
  schedule:
    - cron: '*/15 * * * *'
  
  # 2. Manuel Tetikleme (Parametreli)
  workflow_dispatch:
    inputs:
      mod:
        description: 'Tarama Modu'
        required: true
        default: 'rotasyon'
        type: choice
        options:
          - 'rotasyon'
          - 'hepsi'
          - 'tek_il'
          - 'aralik'
      plaka:
        description: 'Taranacak İl Plakası (tek_il modu için örn: 2)'
        required: false
        default: '2'
      aralik:
        description: 'Plaka Aralığı (aralik modu için örn: 1-10)'
        required: false
        default: '1-10'

jobs:
  saha-tarama-isi:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depo Dosyalarını Çek
        uses: actions/checkout@v4

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Novra Saha Botunu Çalıştır ve Firebase'e Yaz
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Zamanlanmış Rotasyonel Tarama Başlatılıyor..."
            python saha_bot.py --rotasyon --limit 3 --workers 16
          elif [ "${{ github.event.inputs.mod }}" = "tek_il" ]; then
            echo "Tek İl Tarama: Plaka ${{ github.event.inputs.plaka }}"
            python saha_bot.py --plaka ${{ github.event.inputs.plaka }} --limit 4 --workers 12
          elif [ "${{ github.event.inputs.mod }}" = "aralik" ]; then
            echo "Plaka Aralığı Tarama: ${{ github.event.inputs.aralik }}"
            python saha_bot.py --plaka-aralik ${{ github.event.inputs.aralik }} --limit 3 --workers 16
          elif [ "${{ github.event.inputs.mod }}" = "hepsi" ]; then
            echo "Tüm 81 İl ve İlçeler Taranıyor..."
            python saha_bot.py --hepsi --limit 2 --workers 20
          else
            echo "Varsayılan Rotasyonel Tarama..."
            python saha_bot.py --rotasyon --limit 3 --workers 16
          fi
