name: Novra Saha Botu (Otonom 81 İl ve Kamu Kurumları)

on:
  # 1. Her 15 dakikada bir otonom rotasyonel tarama
  schedule:
    - cron: '*/15 * * * *'
  
  # 2. Manuel Tetikleme (Parametreli)
  workflow_dispatch:
    inputs:
      mod:
        description: 'Tarama Modu'
        required: true
        default: 'rotasyon'
        type: choice
        options:
          - 'rotasyon'
          - 'hepsi'
          - 'tek_il'
          - 'aralik'
      kurum_tipi:
        description: 'Kurum Tipi Filtresi'
        required: true
        default: 'hepsi'
        type: choice
        options:
          - 'hepsi'
          - 'jandarma'
          - 'emniyet'
          - 'meb'
          - 'tarim'
          - 'saglik'
          - 'afad'
          - 'valilik'
          - 'kaymakamlik'
          - 'belediye'
      plaka:
        description: 'Taranacak İl Plakası (tek_il modu için örn: 2)'
        required: false
        default: '2'
      aralik:
        description: 'Plaka Aralığı (aralik modu için örn: 1-10)'
        required: false
        default: '1-10'

jobs:
  saha-tarama-isi:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depo Dosyalarını Çek
        uses: actions/checkout@v4

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Novra Saha Botunu Çalıştır ve Firebase'e Yaz
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          KURUM="${{ github.event.inputs.kurum_tipi || 'hepsi' }}"
          
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Zamanlanmış Rotasyonel Tarama Başlatılıyor..."
            python saha_bot.py --rotasyon --kurum-tipi hepsi --limit 3 --workers 16
          elif [ "${{ github.event.inputs.mod }}" = "tek_il" ]; then
            echo "Tek İl Tarama: Plaka ${{ github.event.inputs.plaka }} (Kurum: $KURUM)"
            python saha_bot.py --plaka ${{ github.event.inputs.plaka }} --kurum-tipi "$KURUM" --limit 4 --workers 12
          elif [ "${{ github.event.inputs.mod }}" = "aralik" ]; then
            echo "Plaka Aralığı Tarama: ${{ github.event.inputs.aralik }} (Kurum: $KURUM)"
            python saha_bot.py --plaka-aralik ${{ github.event.inputs.aralik }} --kurum-tipi "$KURUM" --limit 3 --workers 16
          elif [ "${{ github.event.inputs.mod }}" = "hepsi" ]; then
            echo "Tüm 81 İl ve Kurumlar Taranıyor (Kurum: $KURUM)..."
            python saha_bot.py --hepsi --kurum-tipi "$KURUM" --limit 2 --workers 20
          else
            echo "Varsayılan Rotasyonel Tarama..."
            python saha_bot.py --rotasyon --kurum-tipi "$KURUM" --limit 3 --workers 16
          fi
